<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pruebas de cálculos</title>
<style>
body{font-family:system-ui,sans-serif;margin:16px;line-height:1.45;background:#fff;color:#16231e}
h1{font-size:1.3rem}
.sum{font-weight:700;padding:8px 12px;border-radius:8px;display:inline-block}
.ok{background:#dff1e6;color:#1d6a40}.ko{background:#fbe3e0;color:#a3221b}
li{margin:2px 0}li.ko{padding:2px 6px}
code{font-size:12px}
</style>
</head><body>
<h1>Pruebas de los cálculos (calc.js)</h1>
<p id="sum" class="sum">Ejecutando…</p>
<ol id="out"></ol>
<script src="calc.js"></script>
<script>
(function(){
  var C=window.Calc,res=[],cur='';
  function sp(s){return String(s).replace(/[  ]/g,' ')}
  function eq(a,b,msg){var ok=JSON.stringify(a)===JSON.stringify(b);res.push({g:cur,ok:ok,m:msg+(ok?'':' — esperado '+JSON.stringify(b)+', obtenido '+JSON.stringify(a))})}
  function near(a,b,tol,msg){var ok=Math.abs(a-b)<=tol;res.push({g:cur,ok:ok,m:msg+(ok?'':' — esperado '+b+'±'+tol+', obtenido '+a)})}
  function group(n,f){cur=n;try{f()}catch(e){res.push({g:n,ok:false,m:'Error: '+e.message})}}

  group('Días del mes',function(){
    eq(C.daysInMonth(2026,2),28,'febrero 2026 tiene 28 días');
    eq(C.daysInMonth(2028,2),29,'febrero 2028 (bisiesto) tiene 29');
    eq(C.daysInMonth(2026,4),30,'abril tiene 30');
    eq(C.daysInMonth(2026,10),31,'octubre tiene 31');
  });

  group('Leer importes',function(){
    eq(C.parseAmount('7,50'),750,'«7,50»');
    eq(C.parseAmount('7.50'),750,'«7.50» con punto');
    eq(C.parseAmount('7,5'),750,'«7,5»');
    eq(C.parseAmount(' 12 € '),1200,'con espacios y símbolo €');
    eq(C.parseAmount('1.234,56'),123456,'miles con punto y decimales con coma');
    eq(C.parseAmount('1,234.56'),123456,'miles con coma y decimales con punto');
    eq(C.parseAmount('1.000'),100000,'«1.000» son mil euros');
    eq(C.parseAmount('0'),0,'importe 0');
    eq(C.parseAmount('0,01'),1,'un céntimo');
    eq(C.parseAmount(''),null,'vacío no vale');
    eq(C.parseAmount('-5'),null,'negativo no vale');
    eq(C.parseAmount('abc'),null,'letras no valen');
    eq(C.parseAmount('7,5000'),null,'cuatro decimales no vale');
    eq(C.parseAmount('.'),null,'solo un separador no vale');
  });

  group('Mostrar importes',function(){
    eq(sp(C.formatEUR(750)),'7,50 €','750 céntimos');
    eq(sp(C.formatEUR(0)),'0,00 €','cero');
    eq(sp(C.formatEUR(1234567)),'12.345,67 €','miles con punto');
    eq(sp(C.formatEUR(-1050)),'-10,50 €','negativo');
    eq(C.toInputString(750),'7,50','para un campo: 7,50');
    eq(C.toInputString(1200),'12','para un campo: sin ,00');
  });

  group('Reparto',function(){
    eq(C.allocationDiff(50000,{nec:20000,oci:15000,pro:5000,aho:10000}),{sum:50000,diff:0},'reparto exacto');
    eq(C.allocationDiff(50000,{nec:20000,oci:15000,pro:5000,aho:5000}).diff,5000,'faltan 50 € por repartir');
    eq(C.allocationDiff(50000,{nec:30000,oci:15000,pro:5000,aho:10000}).diff,-10000,'el reparto se pasa en 100 €');
    var A={nec:4000,oci:2500,pro:1000,aho:2000},st;
    st=C.splitStatus(10000,{nec:4000,oci:2500,pro:1500,aho:2000});
    eq([st.kind,sp(st.text)],['exact','Reparto exacto: 100,00 € de 100,00 €.'],'aviso: reparto exacto');
    st=C.splitStatus(10000,A);
    eq([st.kind,st.diff,sp(st.text)],['short',500,'Has repartido 95,00 € de 100,00 €. Te faltan 5,00 €.'],'aviso: falta dinero por repartir, dice cuánto has repartido y cuánto falta');
    st=C.splitStatus(8000,A);
    eq([st.kind,st.diff,sp(st.text)],['over',-1500,'Te pasas 15,00 € del dinero del mes: has repartido 95,00 € de 80,00 €.'],'aviso: el reparto se pasa');
    st=C.splitStatus(0,A);
    eq(st.kind,'empty','aviso: dinero del mes en 0');
    st=C.splitStatus(10001,{nec:4000,oci:2500,pro:1500,aho:2000});
    eq([st.kind,sp(st.text)],['short','Has repartido 100,00 € de 100,01 €. Te faltan 0,01 €.'],'aviso: un céntimo que no cuadra');
    st=C.splitStatus(9999,{nec:4000,oci:2500,pro:1500,aho:2000});
    eq([st.kind,st.diff],['over',-1],'aviso: un céntimo de más');
    st=C.splitStatus(12000,{nec:4000,oci:2500,pro:1500,aho:2000},{totalChanged:true});
    eq(sp(st.text),'El dinero del mes ahora es 120,00 €. Has repartido 100,00 € de 120,00 €. Te faltan 20,00 €.','aviso: explica que ha cambiado el dinero del mes');
    eq(C.splitStatus(10000,{nec:4000,oci:2500,pro:1500,aho:2000},{totalChanged:true}).text.indexOf('ahora es'),-1,'si cuadra no hace falta explicar el cambio');
    eq(C.fixProposal(10000,A,'pro'),{key:'pro',from:1000,to:1500,up:true},'cuadrar si falta: sube la sección');
    eq(C.fixProposal(8000,A,'pro'),null,'cuadrar si sobra más de lo que tiene la sección: no se propone');
    eq(C.fixProposal(9000,A,'nec'),{key:'nec',from:4000,to:3500,up:false},'cuadrar si sobra: baja la sección');
    eq(C.fixProposal(9500,A,'pro'),null,'reparto exacto: nada que cuadrar');
    eq(C.fixProposal(0,A,'pro'),null,'dinero del mes en 0: no se propone cuadrar');
    eq(C.fixProposal(9499,A,'pro'),{key:'pro',from:1000,to:999,up:false},'cuadrar con céntimos');
    function sumOf(o){return Object.keys(o).reduce(function(t,k){return t+o[k]},0)}
    var S4=[{id:'nec',group:'need',cur:40000},{id:'oci',group:'want',cur:25000},{id:'pro',group:'want',cur:10000},{id:'aho',group:'save',cur:20000}],r;
    r=C.rule503020(100000,S4);
    eq(r.alloc,{nec:50000,oci:21429,pro:8571,aho:20000},'50/30/20 con las 4 secciones de serie: los deseos mantienen su proporción (250:100)');
    eq(r.groups,{need:['nec'],want:['oci','pro'],save:['aho']},'50/30/20: dice qué secciones van en cada grupo');
    r=C.rule503020(100000,[{id:'nec',group:'need',cur:30000},{id:'x1',group:'need',cur:60000},{id:'oci',group:'want',cur:0},{id:'x2',group:'want',cur:0},{id:'aho',group:'save',cur:0}]);
    eq(r.alloc,{nec:16667,x1:33333,oci:15000,x2:15000,aho:20000},'50/30/20 con secciones propias: necesidades 1:2 y deseos a 0 a partes iguales');
    r=C.rule503020(50000,[{id:'nec',group:'need',cur:100},{id:'aho',group:'save',cur:100}]);
    eq([r.alloc,r.pct],[{nec:40000,aho:10000},{need:80,want:0,save:20}],'50/30/20 sin deseos: su 30 % pasa a necesidades');
    r=C.rule503020(50000,[{id:'oci',group:'want',cur:100},{id:'aho',group:'save',cur:100}]);
    eq(r.alloc,{oci:40000,aho:10000},'50/30/20 sin necesidades: su 50 % pasa a deseos');
    r=C.rule503020(1001,S4);
    eq([sumOf(r.alloc),r.alloc.aho],[1001,200],'50/30/20 con céntimos que no cuadran: suma exactamente el total');
    r=C.rule503020(9999999,S4);
    eq(sumOf(r.alloc),9999999,'50/30/20 con el máximo: no se pierde ni un céntimo');
    eq(sumOf(C.rule503020(0,S4).alloc),0,'50/30/20 con dinero del mes en 0: todo a 0');
    var P={nec:45,oci:25,pro:10,aho:20};
    var s=C.splitByPercent(40000,P);eq(s,{nec:18000,oci:10000,pro:4000,aho:8000},'400 € con 45/25/10/20');
    s=C.splitByPercent(100001,P);eq(C.sum([s.nec,s.oci,s.pro,s.aho]),100001,'1000,01 €: no se pierde ningún céntimo');
    s=C.splitByPercent(1,P);eq(C.sum([s.nec,s.oci,s.pro,s.aho]),1,'un solo céntimo va entero a una sección');
    s=C.splitByPercent(0,P);eq(s,{nec:0,oci:0,pro:0,aho:0},'importe 0');
    s=C.splitByPercent(1000,{a:1,b:1,c:1});eq(C.sum([s.a,s.b,s.c]),1000,'10 € entre 3 (no divide exacto) suma 10 €');
    eq([s.a,s.b,s.c].sort(),[333,333,334],'10 € entre 3: 3,33 + 3,33 + 3,34');
    s=C.splitByPercent(50000,{a:30,b:30,c:30});eq(C.sum([s.a,s.b,s.c]),50000,'porcentajes que no suman 100 se normalizan');
  });

  group('Compensar al pasarse',function(){
    var r=C.proportionalCuts(3000,[{id:'nec',rem:13200},{id:'pro',rem:5000}]);
    eq(r.cuts,{nec:2176,pro:824},'30 € repartidos según lo que queda (21,76 + 8,24)');
    eq(r.covered+r.short,3000,'cubre todo');
    r=C.proportionalCuts(100,[{id:'a',rem:300},{id:'b',rem:300},{id:'c',rem:300}]);
    eq(C.sum([r.cuts.a,r.cuts.b,r.cuts.c]),100,'1 € entre 3 secciones iguales suma 1 €');
    r=C.proportionalCuts(1000,[{id:'a',rem:300},{id:'b',rem:200}]);
    eq(r,{cuts:{a:300,b:200},covered:500,short:500},'si no llega, recorta todo y dice lo que falta');
    r=C.proportionalCuts(0,[{id:'a',rem:300}]);eq(r.cuts.a,0,'nada que compensar');
    r=C.proportionalCuts(500,[]);eq(r.short,500,'sin secciones con margen');
  });

  group('Semana y margen',function(){
    eq(C.weekWindow(27,2,31),{d0:26,d1:31},'martes 27 de octubre: semana 26–31 (fin de mes)');
    eq(C.weekWindow(1,4,31),{d0:1,d1:4},'jueves 1 de octubre: semana 1–4');
    eq(C.weekWindow(14,3,31),{d0:12,d1:18},'miércoles 14: semana 12–18');
    eq(C.weekWindow(28,6,28),{d0:23,d1:28},'sábado 28 de febrero (28 días)');
    eq(C.weekWindow(30,1,30),{d0:30,d1:30},'lunes 30 de noviembre (30 días): semana de un día');
    eq(C.weekBudget(26350,2000,12,18,31),{budget:9922,can:7922},'283,50 € al empezar la semana, 7 de 20 días, 20 € gastados');
    eq(C.weekBudget(10000,0,1,7,28),{budget:2500,can:2500},'mes de 28 días: 100 € → 25 € la primera semana');
    eq(C.weekBudget(9000,0,1,7,30),{budget:2100,can:2100},'mes de 30 días: 90 € → 21 €');
    eq(C.weekBudget(0,0,1,7,31),{budget:0,can:0},'importe 0');
    eq(C.weekBudget(-500,0,12,18,31).budget,0,'si ya se pasó del mes, no hay margen');
    eq(C.weekBudget(1000,0,1,7,31).budget,225,'10 € en 7 de 31 días: 2,258… → 2,25 (hacia abajo)');
  });

  group('Tope semanal de ocio',function(){
    eq(C.ocioWeeklyCap(15000,31),3387,'150 € en 31 días → 33,87 €');
    eq(C.ocioWeeklyCap(15000,30),3500,'150 € en 30 días → 35 €');
    eq(C.ocioWeeklyCap(15000,28),3750,'150 € en 28 días → 37,50 €');
    eq(C.ocioWeeklyCap(0,31),0,'ocio 0');
  });

  group('Proyección del ahorro',function(){
    var p=C.projectSavings(10000,12,0,0);eq(p[11],120000,'100 €/mes un año sin interés');
    var i=C.monthlyRate(2,false,0.19);p=C.projectSavings(0,12,100000,i);near(p[11],102000,2,'1.000 € al 2 % TAE durante un año ≈ 1.020 €');
    i=C.monthlyRate(2,true,0.19);p=C.projectSavings(0,12,100000,i);near(p[11],101618,2,'con un 19 % de impuestos, descontado cada mes ≈ 1.016,18 €');
    eq(C.projectSavings(0,3,0,0.01),[0,0,0],'sin dinero no hay intereses');
    eq(C.monthsToGoal(65000,10000,22000,0),5,'faltan 430 € a 100 €/mes: 5 meses');
    eq(C.monthsToGoal(65000,0,0,0),null,'sin aportar nunca se llega');
    eq(C.monthsToGoal(500,100,600,0),0,'ya conseguido');
  });

  group('Migración v1 → v2 (euros a céntimos)',function(){
    var v1={schemaVersion:1,
      plan:{total:500,alloc:{nec:200,oci:150,pro:50,aho:100,xabc123:12.5},saved0:300.1,goal:0,rate:2.5,months:24,tax:true,names:{nec:'Básicos'},
        extras:[{id:'xabc123',ci:1}],goals:[{id:'gabc123',name:'Roma',target:650,saved:220.35}],fixed:[{id:'fabc1234',cat:'oci',amt:12.99,note:'Netflix',day:5}],lastCat:'oci'},
      months:{'2026-10':{expenses:[{id:'e1',cat:'oci',amt:8.9,note:'',date:'2026-10-02'},{id:'e2',cat:'nec',amt:0.1,note:'',date:'2026-10-03'},{id:'e3',cat:'nec',amt:0.2,note:'',date:'2026-10-03',fixed:'fabc1234'}],fixedDone:['fabc1234']},
              '2026-09':{expenses:[]}}};
    var v2=C.migrateStore(v1);
    eq(v2.schemaVersion,2,'queda en la versión 2');
    eq(v2.plan.total,50000,'500 € → 50000 céntimos');
    eq(v2.plan.alloc,{nec:20000,oci:15000,pro:5000,aho:10000,xabc123:1250},'reparto en céntimos (12,5 € → 1250)');
    eq(v2.plan.saved0,30010,'300,10 € sin error de coma flotante');
    eq(v2.plan.goals[0],{id:'gabc123',name:'Roma',target:65000,saved:22035},'objetivo en céntimos');
    eq(v2.plan.fixed[0].amt,1299,'gasto fijo 12,99 € → 1299');
    eq(v2.plan.names,{nec:'Básicos'},'los nombres se conservan');
    eq(v2.plan.rate,2.5,'la TAE (porcentaje) no se toca');
    eq(v2.months['2026-10'].expenses.map(function(e){return e.amt}),[890,10,20],'8,9 + 0,1 + 0,2 € → 890 + 10 + 20');
    eq(v2.months['2026-10'].expenses[2].fixed,'fabc1234','se conserva la marca de gasto fijo');
    eq(v2.months['2026-10'].fixedDone,['fabc1234'],'se conservan los fijos ya apuntados');
    eq(C.verifyMigration(v1,v2),[],'la verificación no encuentra pérdidas');
    eq(v1.plan.total,500,'el original no se modifica');
    var bad=JSON.parse(JSON.stringify(v2));bad.months['2026-10'].expenses.pop();
    eq(C.verifyMigration(v1,bad).length>0,true,'la verificación detecta un gasto perdido');
    eq(C.migrateStore(v2),v2,'migrar datos ya actuales no cambia nada');
    var threw=false;try{C.migrateStore({schemaVersion:99})}catch(e){threw=true}
    eq(threw,true,'rechaza datos de una versión más nueva');
  });

  group('Copias de seguridad',function(){
    var r=C.readBackup({v:1,plan:{total:300,alloc:{nec:100,oci:100,pro:50,aho:50}},months:{'2026-10':[{id:'a',cat:'oci',amt:7.5,note:'',date:'2026-10-01'}]}});
    eq(r.ok,true,'acepta una copia antigua (v:1)');
    eq(r.store.plan.total,30000,'y la pasa a céntimos');
    eq(r.store.months['2026-10'].expenses[0].amt,750,'7,50 € → 750');
    r=C.readBackup({schemaVersion:2,plan:{total:30000},months:{'2026-10':{expenses:[{id:'a',cat:'oci',amt:750,note:'',date:'2026-10-01'}]}}});
    eq(r.ok&&r.store.months['2026-10'].expenses[0].amt,750,'acepta una copia nueva sin volver a convertir');
    r=C.readBackup({schemaVersion:2,months:{'2026-10':[{id:'a',cat:'oci',amt:-5,date:'2026-10-01'},{id:'b',cat:'oci',amt:5,date:'2026-11-01'},{id:'c',cat:'oci',amt:5,date:'2026-10-02'}]}});
    eq([r.ok,r.expenses,r.skipped],[true,1,2],'descarta gastos negativos o con fecha de otro mes');
    eq(C.readBackup('hola').ok,false,'rechaza un texto');
    eq(C.readBackup([]).ok,false,'rechaza una lista');
    eq(C.readBackup({foo:1}).ok,false,'rechaza un objeto que no es una copia');
    eq(C.readBackup({schemaVersion:9,months:{}}).ok,false,'rechaza una copia de una versión más nueva');
    eq(C.readBackup({v:1,plan:[],months:{}}).ok,false,'rechaza un reparto dañado');
    var raw={'presupuesto:v2:plan':JSON.stringify({schemaVersion:2,total:40000}),'presupuesto:v2:m-2026-10':JSON.stringify({schemaVersion:2,expenses:[{id:'a',cat:'oci',amt:350,note:'',date:'2026-10-02'}]}),
      'presupuesto:v1:prefs':'{"theme":"dark"}','presupuesto:v1:plan':JSON.stringify({total:999})};
    r=C.readBackup({app:'presupuesto-mensual',kind:'raw',raw:raw});
    eq([r.ok,r.store.plan.total,r.store.months['2026-10'].expenses[0].amt],[true,40000,350],'acepta la descarga de emergencia y usa el formato nuevo');
    r=C.readBackup({'presupuesto:v1:plan':JSON.stringify({total:12.5}),'presupuesto:v1:m-2026-09':JSON.stringify({expenses:[{id:'b',cat:'nec',amt:1.1,note:'',date:'2026-09-01'}]})});
    eq([r.ok,r.store.plan.total,r.store.months['2026-09'].expenses[0].amt],[true,1250,110],'acepta la copia del formato anterior (euros) y la convierte');
    eq(C.readBackup({raw:{'presupuesto:v1:prefs':'{}'}}).ok,false,'rechaza una descarga sin datos de dinero');
  });

  group('Exportar a CSV (Excel)',function(){
    var csv=C.expensesCSV([{date:'2026-10-05',section:'Ocio',note:'Cine; palomitas',amt:1250,fixed:false},{date:'2026-10-01',section:'Básicos',note:'Dijo "hola"',amt:5,fixed:true}]);
    eq(csv.charCodeAt(0),0xFEFF,'empieza con BOM (UTF-8 para Excel)');
    var lines=csv.slice(1).split('\r\n');
    eq(lines[0],'Fecha;Sección;Concepto;Importe (€);Gasto fijo','cabecera con «;»');
    eq(lines[1],'05/10/2026;Ocio;"Cine; palomitas";12,50;No','fecha española, coma decimal y «;» entrecomillado');
    eq(lines[2],'01/10/2026;Básicos;"Dijo ""hola""";0,05;Sí','comillas dobladas y céntimos');
    eq(C.expensesCSV([]).slice(1),'Fecha;Sección;Concepto;Importe (€);Gasto fijo\r\n','sin gastos: solo la cabecera');
  });

  var bad=res.filter(function(r){return !r.ok}).length,el=document.getElementById('sum');
  el.textContent=(bad?bad+' fallos de ':'Todo correcto: ')+res.length+' pruebas';
  el.className='sum '+(bad?'ko':'ok');
  document.title=(bad?'FALLAN '+bad:'OK')+' · '+res.length+' pruebas';
  var last='';
  document.getElementById('out').innerHTML=res.map(function(r){
    var h=(r.g!==last?'</ol><h2 style="font-size:1rem;margin:14px 0 4px">'+r.g+'</h2><ol>':'');last=r.g;
    return h+'<li class="'+(r.ok?'':'ko')+'">'+(r.ok?'✔ ':'✘ ')+r.m.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</li>';
  }).join('');
  window.__results={total:res.length,failed:bad,fails:res.filter(function(r){return !r.ok})};
})();
</script>
</body></html>
